<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pop Culture Quiz</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #8b5cf6 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .badge-glow {
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.5);
        }
        @keyframes pop {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="text-slate-100 antialiased min-h-screen flex items-center justify-center p-4">

    <!-- Main Container -->
    <div class="w-full max-w-2xl">
        
        <!-- Welcome Screen -->
        <div id="welcome-screen" class="glass-card rounded-3xl p-6 sm:p-10 text-center animate-pop">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-tr from-amber-400 to-pink-500 rounded-2xl mb-6 shadow-lg shadow-pink-500/30">
                <i class="fa-solid font-black fa-film text-4xl text-white"></i>
            </div>
            <h1 class="text-3xl sm:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-pink-300 to-sky-200 mb-4">
                Мир Мультфильмов
            </h1>
            <p class="text-slate-100 text-base sm:text-lg mb-8 max-w-md mx-auto font-medium">
                Проверь свои знания анимационных шедевров Disney, Pixar, DreamWorks и любимых мультсериалов!
            </p>
            <button onclick="quizApp.startQuiz()" class="w-full sm:w-auto px-8 py-4 bg-gradient-to-r from-amber-400 via-pink-500 to-purple-600 hover:from-amber-500 hover:to-purple-700 text-white font-extrabold rounded-2xl shadow-lg hover:shadow-pink-500/30 transition duration-200 transform hover:-translate-y-0.5 active:translate-y-0 text-lg">
                Начать викторину <i class="fa-solid fa-play ml-2"></i>
            </button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="glass-card rounded-3xl p-6 sm:p-8 hidden">
            <!-- Header (Progress & Score) -->
            <div class="flex items-center justify-between mb-6">
                <div>
                    <span id="question-number" class="text-xs font-bold uppercase tracking-wider text-amber-300">Вопрос 1 из 10</span>
                    <h2 id="category-tag" class="text-xs text-slate-200 font-medium">Категория</h2>
                </div>
                <div class="bg-slate-900/40 border border-white/20 px-4 py-1.5 rounded-full text-amber-300 font-bold text-sm flex items-center gap-2">
                    <i class="fa-solid fa-star text-amber-400"></i>
                    <span id="score-display">0</span>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-slate-900/40 rounded-full h-3 mb-8 overflow-hidden border border-white/10">
                <div id="progress-bar" class="bg-gradient-to-r from-amber-400 to-pink-500 h-3 rounded-full transition-all duration-300" style="width: 10%"></div>
            </div>

            <!-- Question Card -->
            <div class="mb-6">
                <h3 id="question-text" class="text-xl sm:text-2xl font-bold text-white leading-relaxed">
                    Текст вопроса...
                </h3>
            </div>

            <!-- Options Grid -->
            <div id="options-container" class="grid grid-cols-1 gap-3.5 mb-6">
                <!-- Options injected by JS -->
            </div>

            <!-- Explanation Box (Initially Hidden) -->
            <div id="explanation-box" class="hidden rounded-2xl p-4 mb-6 border transition-all animate-pop">
                <div class="flex items-start gap-3">
                    <i id="explanation-icon" class="fa-solid text-xl mt-0.5"></i>
                    <div>
                        <h4 id="explanation-title" class="font-bold mb-1 text-sm"></h4>
                        <p id="explanation-text" class="text-sm opacity-90 leading-relaxed"></p>
                    </div>
                </div>
            </div>

            <!-- Next Button -->
            <button id="next-btn" onclick="quizApp.nextQuestion()" class="hidden w-full py-4 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-bold rounded-2xl shadow-lg transition duration-200 text-base flex items-center justify-center gap-2">
                <span>Следующий вопрос</span>
                <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="glass-card rounded-3xl p-6 sm:p-10 text-center hidden animate-pop">
            <div class="relative inline-block mb-6">
                <div id="badge-icon-bg" class="w-24 h-24 rounded-3xl flex items-center justify-center text-5xl mx-auto badge-glow">
                    <span id="badge-icon">👑</span>
                </div>
            </div>

            <span class="text-xs uppercase tracking-widest font-bold text-amber-300 block mb-1">Итоговый результат</span>
            <h2 id="result-rank" class="text-2xl sm:text-4xl font-extrabold text-white mb-2">Знаток Мультфильмов</h2>
            <p id="result-description" class="text-slate-100 text-sm sm:text-base mb-6 max-w-sm mx-auto">Отличная работа! Ты прекрасно разбираешься в мире анимации.</p>

            <!-- Score Stats Box -->
            <div class="bg-slate-900/50 rounded-2xl p-4 mb-8 border border-white/10 flex justify-around items-center">
                <div>
                    <div class="text-xs text-slate-300 uppercase font-medium">Правильно</div>
                    <div id="correct-count" class="text-2xl font-bold text-emerald-300">0 / 10</div>
                </div>
                <div class="h-8 w-px bg-white/20"></div>
                <div>
                    <div class="text-xs text-slate-300 uppercase font-medium">Точность</div>
                    <div id="accuracy-percent" class="text-2xl font-bold text-amber-300">0%</div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-3">
                <button onclick="quizApp.restartQuiz()" class="flex-1 py-3.5 px-6 bg-gradient-to-r from-amber-400 via-pink-500 to-purple-600 hover:opacity-90 text-white font-bold rounded-2xl shadow-lg transition duration-200">
                    <i class="fa-solid fa-rotate-right ml-1 mr-2"></i> Сыграть снова
                </button>
            </div>
        </div>

    </div>

    <!-- JavaScript Quiz Logic -->
    <script>
        const questionsData = [
            {
                category: "Гравити Фолз",
                question: "Как зовут главного героя мультсериала «Гравити Фолз», у которого есть сестра-близнец Мейбл?",
                options: ["Сэнди", "Диппер", "Стэнли", "Зус"],
                answer: 1,
                explanation: "Диппер Пайнс — главный герой серии, расследующий аномалии и аномальные тайны городка Гравити Фолз."
            },
            {
                category: "Как приручить дракона",
                question: "Какой вид дракона у викинга Иккинга в мультфильме «Как приручить дракона»?",
                options: ["Громгильда", "Ужасный Монстр", "Беззубик (Ночная Фурия)", "Смертокрыл"],
                answer: 2,
                explanation: "Беззубик принадлежит к редчайшему и умнейшему виду драконов — Ночная Фурия."
            },
            {
                category: "Зверополис",
                question: "Какое животное Джуди Хоппс, ставшая первым офицером полиции своего вида в «Зверополисе»?",
                options: ["Лиса", "Кролик", "Хорек", "Выдра"],
                answer: 1,
                explanation: "Джуди Хоппс — целеустремленная зайчиха (кролик), доказавшая, что в Зверополисе каждый может стать кем угодно."
            },
            {
                category: "Головоломка",
                question: "Какая эмоция является главной в голове у девочки Райли в анимационном фильме Pixar «Головоломка»?",
                options: ["Печаль", "Гнев", "Радость", "Страх"],
                answer: 2,
                explanation: "Радость — ведущая эмоция Райли, которая старается сохранить светлые воспоминания и хорошее настроение."
            },
            {
                category: "DreamWorks",
                question: "В каком мультфильме главный герой — неклюжий панда По, изучающий древнее кунг-фу?",
                options: ["Мадагаскар", "Кунг-фу Панда", "Шрек", "Подводная братва"],
                answer: 1,
                explanation: "«Кунг-фу Панда» рассказывает историю панды По, ставшего Воином Дракона."
            },
            {
                category: "Pixar",
                question: "Какое изысканное французское блюдо готовит крыс Реми, чтобы покорить строгого критика в «Рататуй»?",
                options: ["Рататуй", "Лазанья", "Суфле", "Круассан"],
                answer: 0,
                explanation: "Реми приготовил традиционное овощное блюдо Рататуй, которое напомнило критику Эго его детство."
            },
            {
                category: "Классика Disney",
                question: "Как зовут юного львенка, который становится законным правителем Земли Прайда в «Короле Льве»?",
                options: ["Муфаса", "Кову", "Шрам", "Симба"],
                answer: 3,
                explanation: "Симба — сын Муфасы, прошедший долгий путь от изгнанника до истинного Короля Льва."
            },
            {
                category: "Аладдин",
                question: "Какого цвета волшебный Джинн из лампы в диснеевском мультфильме «Аладдин»?",
                options: ["Красный", "Зеленый", "Синий", "Фиолетовый"],
                answer: 2,
                explanation: "Знаменитый веселый и всемогущий Джинн озвученный Робином Уильямсом имеет яркий синий цвет."
            },
            {
                category: "Мультсериалы",
                question: "Кто из этих персонажей живет в ананасе на дне океана в городке Бикини Боттом?",
                options: ["Патрик Стар", "Сквидвард", "Губка Боб Квадратные Штаны", "Мистер Крабс"],
                answer: 2,
                explanation: "Губка Боб живёт в уютном двухэтажном ананасе по адресу Ракушечная улица, 124."
            },
            {
                category: "Холодное сердце",
                question: "Как зовут младшую сестру королевы Эльзы в мультфильме «Холодное сердце»?",
                options: ["Анна", "Рапунцель", "Мерида", "Белль"],
                answer: 0,
                explanation: "Анна — смелая и любящая сестра Эльзы, отравившаяся в опасное путешествие, чтобы спасти королевство."
            }
        ];

        class QuizApp {
            constructor() {
                this.questions = questionsData;
                this.currentIndex = 0;
                this.score = 0;
                this.selectedAnswer = null;

                // DOM Elements
                this.welcomeScreen = document.getElementById('welcome-screen');
                this.quizScreen = document.getElementById('quiz-screen');
                this.resultScreen = document.getElementById('result-screen');
                this.questionNumber = document.getElementById('question-number');
                this.categoryTag = document.getElementById('category-tag');
                this.scoreDisplay = document.getElementById('score-display');
                this.progressBar = document.getElementById('progress-bar');
                this.questionText = document.getElementById('question-text');
                this.optionsContainer = document.getElementById('options-container');
                this.explanationBox = document.getElementById('explanation-box');
                this.explanationTitle = document.getElementById('explanation-title');
                this.explanationText = document.getElementById('explanation-text');
                this.explanationIcon = document.getElementById('explanation-icon');
                this.nextBtn = document.getElementById('next-btn');
            }

            startQuiz() {
                this.currentIndex = 0;
                this.score = 0;
                this.welcomeScreen.classList.add('hidden');
                this.resultScreen.classList.add('hidden');
                this.quizScreen.classList.remove('hidden');
                this.loadQuestion();
            }

            loadQuestion() {
                const current = this.questions[this.currentIndex];
                this.selectedAnswer = null;

                // Reset UI
                this.explanationBox.classList.add('hidden');
                this.nextBtn.classList.add('hidden');
                
                // Update Progress
                this.questionNumber.textContent = `Вопрос ${this.currentIndex + 1} из ${this.questions.length}`;
                this.categoryTag.textContent = current.category;
                this.scoreDisplay.textContent = this.score;
                this.progressBar.style.width = `${((this.currentIndex + 1) / this.questions.length) * 100}%`;

                // Set Text
                this.questionText.textContent = current.question;

                // Render Options
                this.optionsContainer.innerHTML = '';
                current.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = `w-full text-left p-4 rounded-2xl border border-white/20 bg-slate-900/40 hover:bg-white/20 hover:border-amber-300/60 transition duration-200 text-slate-100 font-semibold text-sm sm:text-base flex items-center justify-between group backdrop-blur-sm`;
                    btn.innerHTML = `
                        <span>${opt}</span>
                        <div class="w-6 h-6 rounded-full border border-white/40 group-hover:border-amber-300 flex items-center justify-center text-xs text-transparent group-hover:text-amber-300">
                            <i class="fa-solid fa-check"></i>
                        </div>
                    `;
                    btn.onclick = () => this.handleAnswer(idx);
                    this.optionsContainer.appendChild(btn);
                });
            }

            handleAnswer(selectedIndex) {
                if (this.selectedAnswer !== null) return; // Prevent multiple clicks

                this.selectedAnswer = selectedIndex;
                const current = this.questions[this.currentIndex];
                const buttons = this.optionsContainer.children;
                const isCorrect = selectedIndex === current.answer;

                if (isCorrect) {
                    this.score++;
                    this.scoreDisplay.textContent = this.score;
                }

                // Highlight buttons
                Array.from(buttons).forEach((btn, idx) => {
                    btn.disabled = true;
                    btn.classList.remove('hover:bg-white/20', 'hover:border-amber-300/60');
                    
                    if (idx === current.answer) {
                        // Correct Answer Style
                        btn.className = 'w-full text-left p-4 rounded-2xl border border-emerald-400/80 bg-emerald-600/40 text-emerald-100 font-bold text-sm sm:text-base flex items-center justify-between shadow-lg';
                        btn.querySelector('div').className = 'w-6 h-6 rounded-full bg-emerald-400 text-slate-950 flex items-center justify-center text-xs font-bold';
                    } else if (idx === selectedIndex && !isCorrect) {
                        // Wrong Selection Style
                        btn.className = 'w-full text-left p-4 rounded-2xl border border-rose-400/80 bg-rose-600/40 text-rose-100 font-semibold text-sm sm:text-base flex items-center justify-between shadow-lg';
                        btn.querySelector('div').className = 'w-6 h-6 rounded-full bg-rose-500 text-white flex items-center justify-center text-xs';
                        btn.querySelector('div').innerHTML = '<i class="fa-solid fa-xmark"></i>';
                    } else {
                        btn.classList.add('opacity-40');
                    }
                });

                // Show Explanation
                this.explanationBox.classList.remove('hidden');
                if (isCorrect) {
                    this.explanationBox.className = 'rounded-2xl p-4 mb-6 border bg-emerald-950/40 border-emerald-400/50 text-emerald-200 animate-pop';
                    this.explanationIcon.className = 'fa-solid fa-circle-check text-emerald-400 text-xl mt-0.5';
                    this.explanationTitle.textContent = 'Правильно!';
                } else {
                    this.explanationBox.className = 'rounded-2xl p-4 mb-6 border bg-rose-950/40 border-rose-400/50 text-rose-200 animate-pop';
                    this.explanationIcon.className = 'fa-solid fa-circle-xmark text-rose-400 text-xl mt-0.5';
                    this.explanationTitle.textContent = 'Неверно';
                }
                this.explanationText.textContent = current.explanation;

                // Show Next Button
                this.nextBtn.classList.remove('hidden');
            }

            nextQuestion() {
                this.currentIndex++;
                if (this.currentIndex < this.questions.length) {
                    this.loadQuestion();
                } else {
                    this.showResults();
                }
            }

            showResults() {
                this.quizScreen.classList.add('hidden');
                this.resultScreen.classList.remove('hidden');

                const total = this.questions.length;
                const percentage = Math.round((this.score / total) * 100);

                document.getElementById('correct-count').textContent = `${this.score} / ${total}`;
                document.getElementById('accuracy-percent').textContent = `${percentage}%`;

                // Set Badge & Rank based on score
                const badgeIcon = document.getElementById('badge-icon');
                const badgeBg = document.getElementById('badge-icon-bg');
                const resultRank = document.getElementById('result-rank');
                const resultDesc = document.getElementById('result-description');

                if (this.score === 10) {
                    badgeIcon.textContent = '👑';
                    badgeBg.className = 'w-24 h-24 rounded-3xl flex items-center justify-center text-5xl mx-auto bg-gradient-to-tr from-amber-400 to-yellow-300 badge-glow';
                    resultRank.textContent = 'Магистр Анимации!';
                    resultDesc.textContent = 'Невероятно! Ты набрал 10 из 10 и знаешь абсолютно всё про мультфильмы!';
                } else if (this.score >= 7) {
                    badgeIcon.textContent = '🌟';
                    badgeBg.className = 'w-24 h-24 rounded-3xl flex items-center justify-center text-5xl mx-auto bg-gradient-to-tr from-pink-500 to-purple-500 badge-glow';
                    resultRank.textContent = 'Настоящий Знаток!';
                    resultDesc.textContent = 'Замечательный результат! Ты отлично помнишь сюжетов и персонажей любимых мультфильмов.';
                } else if (this.score >= 4) {
                    badgeIcon.textContent = '🍿';
                    badgeBg.className = 'w-24 h-24 rounded-3xl flex items-center justify-center text-5xl mx-auto bg-gradient-to-tr from-cyan-400 to-blue-500 badge-glow';
                    resultRank.textContent = 'Любитель Мультиков';
                    resultDesc.textContent = 'Хороший результат! Но некоторые детали ускользнули от твоего внимания.';
                } else {
                    badgeIcon.textContent = '🎨';
                    badgeBg.className = 'w-24 h-24 rounded-3xl flex items-center justify-center text-5xl mx-auto bg-gradient-to-tr from-slate-600 to-slate-400 badge-glow';
                    resultRank.textContent = 'Начинающий Мультиман';
                    resultDesc.textContent = 'Отличный повод пересмотреть классические мультфильмы и попробывать снова!';
                }
            }

            restartQuiz() {
                this.startQuiz();
            }
        }

        // Initialize App
        let quizApp;
        window.onload = () => {
            quizApp = new QuizApp();
        };
    </script>
</body>
</html>
